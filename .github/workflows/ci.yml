name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/makker/interfaces/server/webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/makker/interfaces/server/webapp/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The server ships the committed bundle, so it must be what the source builds.
      - name: Committed web_dist matches the source
        run: |
          if [ -n "$(git status --porcelain -- ../web_dist)" ]; then
            git status --porcelain -- ../web_dist
            echo "::error::web_dist is stale: run npm ci and npm run build in the webapp, then commit web_dist."
            exit 1
          fi

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      # Report every OS even if one fails, so a Windows-only break doesn't
      # mask a macOS-only one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          # `uv tool install` uses the newest Python it finds, often 3.14.
          - os: ubuntu-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked --extra eval

      # Julia integration runs on every PR/push in simulators.yml and weekly
      # against the latest compatible simulator releases. Two workers run the
      # complete Python suite; loadfile keeps each test module together.
      - name: Test
        run: uv run pytest -m "not integration" -n 2 --dist loadfile
